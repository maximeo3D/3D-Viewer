<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Éditeur 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="editor.css">
    <script src="https://cdn.babylonjs.com/v7.54.2/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/v7.54.2/loaders/babylonjs.loaders.min.js"></script>
    <script>
        if (window.BABYLON && BABYLON.DracoCompression) {
            BABYLON.DracoCompression.Configuration = {
                decoder: {
                    wasmUrl: 'https://cdn.babylonjs.com/v7.54.2/draco_wasm_wrapper_gltf.js',
                    wasmBinaryUrl: 'https://cdn.babylonjs.com/v7.54.2/draco_decoder_gltf.wasm',
                    fallbackUrl: 'https://cdn.babylonjs.com/v7.54.2/draco_decoder_gltf.js'
                }
            };
        }
        if (window.BABYLON && BABYLON.MeshoptCompression) {
            BABYLON.MeshoptCompression.Configuration = {
                decoder: { url: 'https://cdn.babylonjs.com/v7.54.2/meshopt_decoder.js' }
            };
        }
    </script>
    <script src="https://cdn.babylonjs.com/v7.54.2/materialsLibrary/babylonjs.materials.min.js"></script>
    <script src="https://cdn.babylonjs.com/v7.54.2/hdr/babylonjs.hdr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tweakpane@3.1.10/dist/tweakpane.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="tweakpaneManager.js"></script>
    <script src="engravingManager.js"></script>
</head>
<body>
    <div class="editor">
        <aside class="editor-side">
            <nav class="editor-tabs" id="tabs"></nav>
            <div class="editor-panel" id="panel"></div>
            <div class="editor-footer">
                <div class="footer-row">
                    <button type="button" id="new-project" class="ghost">Nouveau projet</button>
                    <button type="button" id="import-project" class="ghost">Importer</button>
                </div>
                <div class="footer-row">
                    <button type="button" id="revert-all" class="ghost">Annuler</button>
                    <button type="button" id="save-all">Enregistrer<span id="save-check" class="save-check" aria-hidden="true"><i class="fa-solid fa-check"></i></span></button>
                    <button type="button" id="export-project">Exporter</button>
                </div>
                <p id="status" hidden></p>
            </div>
        </aside>
        <main class="editor-stage">
            <div class="editor-viewport">
                <canvas id="renderCanvas"></canvas>
            </div>
            <div class="rulebar" id="rulebar"></div>
        </main>
    </div>
    <input type="file" id="file-bin" accept=".bin,.glb,.gltf" multiple hidden>
    <input type="file" id="file-image" accept="image/png,image/jpeg,image/webp" hidden>
    <input type="file" id="file-env" accept=".hdr,.env" hidden>
    <input type="file" id="file-font" accept=".ttf,.otf,.woff,.woff2" hidden>
    <input type="file" id="file-project" accept=".zip,application/zip" hidden>
    <script>
        window.showTweakpane = false;
        window.viewerApplyDefaults = true;
    </script>
    <script src="scene.js"></script>
    <script src="viewerApi.js"></script>
    <script src="editor.js"></script>
</body>
</html>
